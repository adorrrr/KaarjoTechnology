<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Title/description/canonical/Open Graph/Twitter/robots tags are set per
      route by the <Seo/> component (react-helmet-async) in
      src/components/Seo.jsx — deliberately NOT duplicated as static meta
      tags here, since react-helmet-async only manages tags it renders
      itself and would leave a stray duplicate `description`/`og:*` meta
      sitting next to its own. `document.title` is the one exception:
      Helmet updates it via the DOM Title API in place (no duplicate node),
      so this bare title is a safe fallback for the instant before React
      mounts — the actual per-route title/description/OG/JSON-LD that
      crawlers and link-preview bots see comes from the static prerendered
      HTML (see scripts/prerender.mjs), where Helmet has already run.
    -->
    <title>Kaarjo Technology | Engineering Intelligent Software</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#07090E" />
    <meta name="author" content="Kaarjo Technology" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Inter+Tight:wght@200;300;400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="/kanfbot.webp" fetchpriority="high">

    <!-- Sitewide Organization/WebSite structured data (per-page Service /
         BreadcrumbList schema is added by <Seo/> on top of this). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Kaarjo Technology",
      "alternateName": ["Kaarjo Tech", "Kaarjo"],
      "url": "https://kaarjotech.com",
      "logo": "https://kaarjotech.com/favicon.svg",
      "image": "https://kaarjotech.com/og-cover.png",
      "description": "Kaarjo Technology (Kaarjo Tech) is an AI-first software engineering company building AI products, MVPs, ERP systems and autonomous agents for startups, SMEs, enterprises and government.",
      "email": "kaarjo.info@gmail.com",
      "telephone": "+8801868551643",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Chittagong Hi-Tech Park",
        "addressLocality": "Chattogram",
        "postalCode": "4000",
        "addressCountry": "BD"
      },
      "areaServed": ["BD", "Global"]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Kaarjo Technology",
      "alternateName": "Kaarjo Tech",
      "url": "https://kaarjotech.com"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
