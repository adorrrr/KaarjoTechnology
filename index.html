function wirePageEvents() {
  const burger = document.getElementById('burger');
  const drawer = document.getElementById('mobileDrawer');
  if (burger && drawer) {
    const closeDrawer = () => {
      burger.classList.remove('on');
      drawer.classList.remove('on');
      burger.setAttribute('aria-expanded', 'false');
    };

    burger.onclick = (e) => {
      e.stopPropagation();
      const on = burger.classList.toggle('on');
      drawer.classList.toggle('on', on);
      burger.setAttribute('aria-expanded', on);
    };

    drawer.querySelectorAll('a, button').forEach(el => {
      el.onclick = () => closeDrawer();
    });
  }

  const dd = document.querySelector('.dd');
  if (dd) {
    const btn = dd.querySelector('.navitem');
    if (btn) {
      btn.onclick = (e) => {
        e.stopPropagation();
        const on = dd.classList.toggle('open');
        btn.setAttribute('aria-expanded', on);
      };
    }
  }

  document.querySelectorAll('.faq-item').forEach(item => {
    const q = item.querySelector('.faq-q');
    const a = item.querySelector('.faq-a');
    if (q && a) {
      q.onclick = () => {
        const open = item.classList.contains('open');
        item.closest('.faq').querySelectorAll('.faq-item').forEach(o => {
          o.classList.remove('open');
          const otherA = o.querySelector('.faq-a');
          const otherQ = o.querySelector('.faq-q');
          if (otherA) otherA.style.maxHeight = null;
          if (otherQ) otherQ.setAttribute('aria-expanded', 'false');
        });
        if (!open) {
          item.classList.add('open');
          a.style.maxHeight = a.scrollHeight + 'px';
          q.setAttribute('aria-expanded', 'true');
        }
      };
    }
  });

  init3DInteractiveTilt();

  const form = document.getElementById('contactForm');
  if (form) {
    const sent = document.getElementById('sentState');
    const errBox = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');
    const submitLabel = submitBtn ? submitBtn.innerHTML : '';
    
    const fail = (el) => { if (el) el.closest('.field').classList.add('err'); };
    
    form.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('input', () => el.closest('.field').classList.remove('err'));
      el.addEventListener('change', () => el.closest('.field').classList.remove('err'));
    });
    
    form.onsubmit = e => {
      e.preventDefault();
      if (errBox) errBox.style.display = 'none';
      let ok = true, first = null;
      const v = id => form.querySelector(id);
      
      const checks = [
        [v('#f-name'), el => el && el.value.trim().length >= 2],
        [v('#f-email'), el => el && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value.trim())],
        [v('#f-service'), el => el && el.value !== ''],
        [v('#f-msg'), el => el && el.value.trim().length > 0]
      ];
      
      checks.forEach(([el, test]) => {
        if (!test(el)) { fail(el); ok = false; first = first || el; }
      });
      
      if (!ok) { if (first) first.focus(); return; }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Transmitting Inquiry…';
      }

      const nameVal = (v('#f-name') ? v('#f-name').value.trim() : '');
      const emailVal = (v('#f-email') ? v('#f-email').value.trim() : '');
      const companyVal = (v('#f-company') ? v('#f-company').value.trim() : '');
      const serviceVal = (v('#f-service') ? v('#f-service').value : '');
      const msgVal = (v('#f-msg') ? v('#f-msg').value.trim() : '');

      const templateParams = {
        name: nameVal,
        from_name: nameVal,
        user_name: nameVal,
        email: emailVal,
        from_email: emailVal,
        user_email: emailVal,
        reply_to: emailVal,
        to_email: 'kaarjo.info@gmail.com',
        to_name: 'Kaarjo Team',
        company: companyVal || 'Not specified',
        service: serviceVal,
        discipline: serviceVal,
        message: msgVal
      };

      (async () => {
        let sentOk = false;
        let errReason = '';

        // 1. Try emailjs.send with publicKey options
        if (typeof emailjs !== 'undefined' && emailjs.send) {
          try {
            const r1 = await emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, templateParams, {
              publicKey: EMAILJS.publicKey
            });
            if (r1 && (r1.status === 200 || r1.text === 'OK')) sentOk = true;
          } catch (e1) {
            errReason = (e1 && (e1.text || e1.message)) ? (e1.text || e1.message) : '';
            console.warn('[kaarjo] emailjs.send options attempt failed:', e1);
          }

          // 2. Try emailjs.send with string public key
          if (!sentOk) {
            try {
              const r2 = await emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, templateParams, EMAILJS.publicKey);
              if (r2 && (r2.status === 200 || r2.text === 'OK')) sentOk = true;
            } catch (e2) {
              if (!errReason && e2) errReason = e2.text || e2.message || '';
              console.warn('[kaarjo] emailjs.send string attempt failed:', e2);
            }
          }

          // 3. Try emailjs.sendForm
          if (!sentOk) {
            try {
              const r3 = await emailjs.sendForm(EMAILJS.serviceId, EMAILJS.templateId, form, {
                publicKey: EMAILJS.publicKey
              });
              if (r3 && (r3.status === 200 || r3.text === 'OK')) sentOk = true;
            } catch (e3) {
              if (!errReason && e3) errReason = e3.text || e3.message || '';
              console.warn('[kaarjo] emailjs.sendForm attempt failed:', e3);
            }
          }
        }

        // 4. Try direct REST API fallback
        if (!sentOk) {
          try {
            const resp = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify({
                service_id: EMAILJS.serviceId,
                template_id: EMAILJS.templateId,
                user_id: EMAILJS.publicKey,
                template_params: templateParams
              })
            });
            if (resp.ok) {
              sentOk = true;
            } else {
              const resTxt = await resp.text();
              if (!errReason) errReason = resTxt;
              console.warn('[kaarjo] direct API call failed:', resp.status, resTxt);
            }
          } catch (fetchErr) {
            if (!errReason) errReason = fetchErr.message;
            console.warn('[kaarjo] direct fetch network error:', fetchErr);
          }
        }

        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = submitLabel;
        }

        if (sentOk) {
          form.style.display = 'none';
          if (sent) sent.classList.add('on');
        } else {
          if (errBox) {
            errBox.style.display = 'block';
            const mailtoHref = 'mailto:kaarjo.info@gmail.com?subject=' + encodeURIComponent('Project Inquiry from ' + nameVal) + '&body=' + encodeURIComponent('Name: ' + nameVal + '\nEmail: ' + emailVal + '\nCompany: ' + companyVal + '\nService: ' + serviceVal + '\n\nProblem Scope:\n' + msgVal);
            errBox.innerHTML = (errReason ? '<div style="font-size:12px;margin-bottom:6px;opacity:.9">' + errReason + '</div>' : '') + '<a href="' + mailtoHref + '" style="color:var(--lime);text-decoration:underline;font-weight:700">Click here to send directly via Email (kaarjo.info@gmail.com)</a>';
          }
        }
      })();
    };

    const reset = document.getElementById('resetForm');
    if (reset) {
      reset.onclick = () => {
        form.reset();
        form.style.display = '';
        if (sent) sent.classList.remove('on');
      };
    }
  }
}

// Global Nav Sticky Scroll Handler
window.addEventListener('scroll', () => {
  const navWrap = document.getElementById('navWrap');
  if (navWrap) {
    if (window.scrollY > 20) navWrap.classList.add('stuck');
    else navWrap.classList.remove('stuck');
  }
}, { passive: true });

document.addEventListener('click', (e) => {
  const dd = document.querySelector('.dd');
  if (dd && !dd.contains(e.target)) {
    dd.classList.remove('open');
    const btn = dd.querySelector('.navitem');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }
  const drawer = document.getElementById('mobileDrawer');
  const burger = document.getElementById('burger');
  if (drawer && drawer.classList.contains('on') && !drawer.contains(e.target) && burger && !burger.contains(e.target)) {
    burger.classList.remove('on');
    drawer.classList.remove('on');
    burger.setAttribute('aria-expanded', 'false');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const dd = document.querySelector('.dd');
    if (dd) dd.classList.remove('open');
  }
});

/* ============================================================
   ROUTER & SINGLE-PAGE APP CONTROLLER
   ============================================================ */
const app = document.getElementById('app');

function parseHash() {
  let raw = (location.hash || '#/').trim();
  let anchor = '';
  if (raw.startsWith('#/#')) {
    anchor = raw.substring(3);
    raw = '#/';
  } else if (raw.startsWith('#/')) {
    const idx = raw.indexOf('#', 2);
    if (idx !== -1) {
      anchor = raw.substring(idx + 1);
      raw = raw.substring(0, idx);
    }
  } else if (raw.startsWith('#') && !raw.startsWith('#/')) {
    const targetId = raw.substring(1);
    if (['folio', 'kanf', 'assessment', 'goronx'].includes(targetId.toLowerCase())) {
      raw = '#/' + targetId;
    } else {
      anchor = targetId;
      raw = '#/';
    }
  }
  const clean = raw.replace(/^#\/?/, '').replace(/\/$/, '');
  const parts = clean ? clean.split('/').filter(Boolean) : [];
  return { parts, anchor };
}

function scrollToAnchor(targetId) {
  if (!targetId) return;
  const el = document.getElementById(targetId);
  if (!el) return;
  
  if (typeof ScrollTrigger !== 'undefined') {
    ScrollTrigger.refresh();
  }
  
  if (lenis) {
    lenis.scrollTo(el, { offset: -20, duration: 0.85 });
  } else {
    const top = el.getBoundingClientRect().top + window.scrollY - 20;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
}

// Global click delegation for cross-page anchor links and mobile drawer auto-close
document.addEventListener('click', (e) => {
  const link = e.target.closest('a[href*="#"]');
  if (!link) return;
  
  // Auto-close mobile drawer and dropdown on navigation
  const drawer = document.getElementById('mobileDrawer');
  const burger = document.getElementById('burger');
  if (drawer && drawer.classList.contains('on')) {
    drawer.classList.remove('on');
    if (burger) {
      burger.classList.remove('on');
      burger.setAttribute('aria-expanded', 'false');
    }
  }
  const dd = document.querySelector('.dd');
  if (dd) dd.classList.remove('open');

  const href = link.getAttribute('href');
  if (!href) return;
  
  const anchorMatch = href.match(/#\/#([a-zA-Z0-9_-]+)/);
  if (anchorMatch) {
    const anchorId = anchorMatch[1];
    const { parts } = parseHash();
    if (parts.length === 0) {
      e.preventDefault();
      if (location.hash !== '#/#' + anchorId) {
        history.replaceState(null, '', '#/#' + anchorId);
      }
      scrollToAnchor(anchorId);
    }
  }
});

let CURRENT = null;
function render() {
  const { parts, anchor } = parseHash();
  const key = parts.join('/');
  
  if (CURRENT === key && document.getElementById('main')) {
    if (anchor) {
      scrollToAnchor(anchor);
      return;
    }
    if (lenis) lenis.scrollTo(0, { duration: 0.6 });
    else window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  
  CURRENT = key;
  let view, title;
  const route0 = parts[0] ? parts[0].toLowerCase() : '';
  const route1 = parts[1] ? parts[1].toLowerCase() : '';
  
  if (route0 === 'services' && SVCMAP[parts[1]]) {
    const s = SVCMAP[parts[1]];
    view = servicePage(s);
    title = `${s.title} — Kaarjo Technology`;
    const m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute('content', s.heroP.slice(0, 155));
  } else if (route0 === 'folio' || (route0 === 'work' && route1 === 'folio')) {
    view = folioProjectPage();
    title = 'Folio — Kaarjo Technology';
    const m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute('content', 'Upload your CV, pick a theme built for your profession, and publish a real portfolio website with NFC identity.');
  } else if (route0 === 'kanf' || (route0 === 'work' && route1 === 'kanf')) {
    view = kanfProjectPage();
    title = 'KANF — Kaarjo Technology';
    const m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute('content', 'One layer that decides how intelligence gets used. Multi-agent orchestration, verification, and model routing.');
  } else if (route0 === 'assessment' || (route0 === 'work' && (route1 === 'assessment' || route1 === 'kaarjo-skill-test'))) {
    view = assessmentProjectPage();
    title = 'Kaarjo Assessment AI — Kaarjo Technology';
    const m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute('content', 'Kaarjo Assessment AI reads capability from evidence, not credentials across fourteen dimensions of human capability.');
  } else if (route0 === 'goronx' || (route0 === 'work' && route1 === 'goronx')) {
    view = goronxProjectPage();
    title = 'GORON X — Kaarjo Technology';
    const m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute('content', 'GORON X connects geometry, loads, analysis, member design, drawings and quantities into one connected structural data model for steel, PEB and RCC projects.');
  } else if (route0 === 'work' && PROJMAP[parts[1]]) {
    const p = PROJMAP[parts[1]];
    view = projectPage(p);
    title = `${p.n} — Kaarjo Technology`;
    const m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute('content', p.d.slice(0, 155));
  } else {
    view = home();
    title = 'Kaarjo Technology';
  }
  
  document.title = title;
  if (app) app.innerHTML = nav() + view + footer();
  
  if (route0 === 'folio' || (route0 === 'work' && route1 === 'folio')) {
    initFolioInteractions();
  } else if (route0 === 'kanf' || (route0 === 'work' && route1 === 'kanf')) {
    initKanfInteractions();
  } else if (route0 === 'assessment' || (route0 === 'work' && (route1 === 'assessment' || route1 === 'kaarjo-skill-test'))) {
    initAssessmentInteractions();
  } else if (route0 === 'goronx' || (route0 === 'work' && route1 === 'goronx')) {
    initGoronxInteractions();
  }
  
  wirePageEvents();
  initGSAPAnimations();
  
  if (anchor) {
    // Wait for layout and GSAP measurement to settle before scrolling
    requestAnimationFrame(() => {
      setTimeout(() => {
        scrollToAnchor(anchor);
      }, 100);
    });
  } else {
    if (lenis) lenis.scrollTo(0, { immediate: true });
    else window.scrollTo(0, 0);
  }
}

window.addEventListener('hashchange', render);
initScrollProgress();
init3DParticleCanvas();
if (!location.hash) location.replace('#/');
render();
</script>
