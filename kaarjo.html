<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#0A0A0A;
  --surface:#121212;
  --surface-2:#171717;
  --glass:rgba(255,255,255,.06);
  --glass-hi:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.08);
  --border-hi:rgba(255,255,255,.16);
  --text:#FFFFFF;
  --muted:#B8B8B8;
  --dim:#767676;
  --lime:#A3E635;
  --lime-deep:#7CB518;
  --lime-ink:#A3E635;
  --lime-glow:rgba(163,230,53,.16);
  --blue-glow:rgba(56,120,255,.10);

  --sheen:rgba(255,255,255,.07);
  --soft:rgba(255,255,255,.03);
  --node-fill:rgba(255,255,255,.055);
  --wire:rgba(255,255,255,.14);
  --gridline:rgba(255,255,255,.035);
  --input-bg:rgba(255,255,255,.04);
  --mock:rgba(255,255,255,.09);
  --nav-bg:rgba(10,10,10,.72);
  --panel-bg:rgba(18,18,18,.92);
  --mobile-bg:rgba(10,10,10,.97);
  --shadow:rgba(0,0,0,.55);
  --shadow-soft:rgba(0,0,0,.5);
  --grad-a:#fff; --grad-b:#cfe9a4; --grad-c:#A3E635;
  --band-a:rgba(163,230,53,.11); --band-b:rgba(255,255,255,.03); --band-edge:rgba(163,230,53,.2);
  --mock-lime:rgba(163,230,53,.45);
  --tsw-bg:#141414; --knob:#E8EAE2;
  color-scheme:dark;

  --r-sm:12px; --r-md:20px; --r-lg:28px; --r-xl:36px;
  --maxw:1200px;
  --gut:clamp(20px,5vw,48px);
  --ease:cubic-bezier(.16,1,.3,1);

  --f-display:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}

html[data-theme="light"]{
  --bg:#F4F6F1;
  --surface:#FFFFFF;
  --surface-2:#EAEDE5;
  --glass:rgba(255,255,255,.66);
  --glass-hi:rgba(255,255,255,.9);
  --border:rgba(14,18,10,.10);
  --border-hi:rgba(14,18,10,.20);
  --text:#0D110A;
  --muted:#4F5449;
  --dim:#7E8477;
  --lime-ink:#4A7A0B;
  --lime-glow:rgba(163,230,53,.34);
  --blue-glow:rgba(56,120,255,.08);

  --sheen:rgba(255,255,255,.75);
  --soft:rgba(255,255,255,.55);
  --node-fill:rgba(255,255,255,.8);
  --wire:rgba(14,18,10,.15);
  --gridline:rgba(14,18,10,.05);
  --input-bg:rgba(255,255,255,.85);
  --mock:rgba(14,18,10,.09);
  --nav-bg:rgba(244,246,241,.78);
  --panel-bg:rgba(255,255,255,.95);
  --mobile-bg:rgba(244,246,241,.98);
  --shadow:rgba(24,34,12,.13);
  --shadow-soft:rgba(24,34,12,.1);
  --grad-a:#0D110A; --grad-b:#3F6B0C; --grad-c:#5E9C10;
  --band-a:rgba(163,230,53,.26); --band-b:rgba(255,255,255,.6); --band-edge:rgba(120,175,30,.34);
  --mock-lime:rgba(122,178,24,.75);
  --tsw-bg:#E4E8DC; --knob:#3D4238;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .45s var(--ease),color .45s var(--ease);
}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}

/* ============================================================
   TYPOGRAPHY  — Nunito set tight & heavy so it reads engineered,
   not friendly. Mono carries all labels and data.
   ============================================================ */
.h-hero{
  font-size:clamp(44px,8.2vw,96px);font-weight:900;line-height:.98;
  letter-spacing:-.045em;margin:0;
}
.h-sec{
  font-size:clamp(32px,5.2vw,60px);font-weight:900;line-height:1.03;
  letter-spacing:-.038em;margin:0;
}
.h-sub{
  font-size:clamp(21px,2.6vw,30px);font-weight:800;line-height:1.2;
  letter-spacing:-.028em;margin:0;
}
.h-card{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:0}
.lede{font-size:clamp(17px,1.7vw,20px);color:var(--muted);line-height:1.65;max-width:60ch;margin:0}
.body-dim{color:var(--muted);margin:0}
.eyebrow{
  font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--lime-ink);display:inline-flex;align-items:center;gap:10px;
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--lime-ink);opacity:.7}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--dim)}
.accent{color:var(--lime-ink)}
.grad-text{
  background:linear-gradient(96deg,var(--grad-a) 18%,var(--grad-b) 55%,var(--grad-c) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}
section{position:relative}
.sec{padding-block:clamp(72px,10vw,140px);scroll-margin-top:84px}
.sec-tight{padding-block:clamp(56px,7vw,96px)}
.stack-sm{display:flex;flex-direction:column;gap:14px}
.stack-md{display:flex;flex-direction:column;gap:22px}
.head-block{max-width:760px;display:flex;flex-direction:column;gap:20px;margin-bottom:clamp(40px,5vw,64px)}
.grid{display:grid;gap:18px}
.grid > *{min-width:0}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g-3,.g-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g-2,.g-3,.g-4{grid-template-columns:1fr}}

/* ambient light */
.glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.glow-lime{background:var(--lime-glow)}
.glow-blue{background:var(--blue-glow)}
@media(max-width:640px){
  .glow{
    width:80vw !important;height:80vw !important;max-width:340px !important;max-height:340px !important;
    left:50% !important;right:auto !important;bottom:auto !important;top:-60px !important;
    transform:translateX(-50%) !important;
  }
  .glow.glow-blue{display:none}
}

/* ============================================================
   GLASS SURFACES
   ============================================================ */
.glass{
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  position:relative;overflow:hidden;
}
.glass > *{position:relative;z-index:1}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,var(--sheen),transparent 42%);
}
.card{
  padding:28px;display:flex;flex-direction:column;gap:14px;
  width:100%;box-sizing:border-box;
  transition:border-color .45s var(--ease),transform .45s var(--ease),background .45s var(--ease);
}
.card:hover{border-color:var(--border-hi);background:var(--glass-hi);transform:translateY(-4px)}
.card p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.62}

/* icon tile */
.ico{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,rgba(163,230,53,.24),rgba(163,230,53,.06));
  border:1px solid rgba(163,230,53,.3);color:var(--lime-ink);
}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 26px;border-radius:100px;font-weight:800;font-size:15.5px;
  letter-spacing:-.012em;white-space:nowrap;position:relative;
  transition:transform .3s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease);
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--lime);color:#0A0A0A;box-shadow:0 6px 30px rgba(163,230,53,.22)}
.btn-primary:hover{background:#b4f04a;box-shadow:0 10px 40px rgba(163,230,53,.34)}
.btn-ghost{border:1px solid var(--border-hi);color:var(--text);background:var(--glass)}
.btn-ghost:hover{background:var(--glass-hi);border-color:rgba(255,255,255,.3)}
.btn-sm{padding:10px 20px;font-size:14px}
.btn .arw{transition:transform .35s var(--ease)}
.btn:hover .arw{transform:translateX(4px)}

.link-arw{
  display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;
  color:var(--lime-ink);letter-spacing:-.01em;
}
.link-arw svg{transition:transform .35s var(--ease)}
.link-arw:hover svg{transform:translateX(5px)}


/* ============================================================
   THEME SWITCH — the knob is a signal travelling a circuit
   trace, echoing the hero system canvas. Dark = trace idle,
   crescent knob. Light = trace energised, knob a lit node.
   ============================================================ */
.tsw{
  position:relative;flex:none;width:64px;height:32px;border-radius:100px;padding:0;
  background:var(--tsw-bg);border:1px solid var(--border-hi);
  transition:border-color .4s var(--ease),background .45s var(--ease);
}
.tsw:hover{border-color:rgba(163,230,53,.5)}
.tsw-wire{
  position:absolute;left:11px;right:11px;top:50%;height:1.5px;margin-top:-.75px;
  background:var(--wire);border-radius:2px;
}
.tsw-wire::before,.tsw-wire::after{
  content:"";position:absolute;top:50%;width:4.5px;height:4.5px;border-radius:50%;
  background:var(--wire);transform:translateY(-50%);
}
.tsw-wire::before{left:-2px}
.tsw-wire::after{right:-2px}
.tsw-trail{
  position:absolute;left:11px;top:50%;height:1.5px;margin-top:-.75px;width:0;
  background:var(--lime);border-radius:2px;box-shadow:0 0 9px var(--lime);
  transition:width .6s var(--ease);
}
.tsw-knob{
  position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:var(--knob);
  transition:transform .6s var(--ease),background .45s var(--ease),box-shadow .45s var(--ease);
}
.tsw-knob::after{
  content:"";position:absolute;inset:0;border-radius:50%;background:var(--tsw-bg);
  transform:translate(7px,-6px);
  transition:transform .55s var(--ease),background .45s var(--ease);
}
html[data-theme="light"] .tsw-trail{width:23px}
html[data-theme="light"] .tsw-knob{
  transform:translateX(32px);background:var(--lime);
  box-shadow:0 0 0 3px rgba(163,230,53,.22),0 0 18px rgba(163,230,53,.65);
}
html[data-theme="light"] .tsw-knob::after{transform:translate(0,0) scale(0)}
/* click feedback: the trace pulses like the hero signal */
.tsw.zap .tsw-wire{animation:zap .6s var(--ease)}
@keyframes zap{0%{background:var(--lime);box-shadow:0 0 10px var(--lime)}100%{background:var(--wire);box-shadow:none}}
@media(max-width:960px){.tsw{width:56px;height:30px}
  .tsw-knob{width:22px;height:22px}
  html[data-theme="light"] .tsw-knob{transform:translateX(26px)}
  html[data-theme="light"] .tsw-trail{width:19px}}

/* ============================================================
   NAV
   ============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  transition:background .4s var(--ease),border-color .4s var(--ease),backdrop-filter .4s;
  border-bottom:1px solid transparent;
}
.nav.stuck{
  background:var(--nav-bg);border-bottom-color:var(--border);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px;letter-spacing:-.05em}
.logo .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);margin-top:6px}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-links a,.nav-links button.navitem{
  padding:9px 15px;border-radius:100px;font-size:15px;font-weight:700;color:var(--muted);
  letter-spacing:-.01em;transition:color .3s,background .3s;display:inline-flex;align-items:center;gap:6px;
}
.nav-links a:hover,.nav-links button.navitem:hover{color:var(--text);background:var(--glass)}
.nav-cta{display:flex;align-items:center;gap:10px}

.dd{position:relative}
.dd-panel{
  position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(-8px);
  width:min(640px,86vw);padding:12px;opacity:0;visibility:hidden;
  transition:opacity .3s var(--ease),transform .3s var(--ease),visibility .3s;
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  background:var(--panel-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 30px 70px var(--shadow);
}
.dd:hover .dd-panel,.dd.open .dd-panel{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.nav-links a.dd-item{display:flex;gap:12px;padding:13px;border-radius:14px;background:none;color:var(--text);align-items:flex-start}
.nav-links a.dd-item:hover{background:var(--glass)}
.dd-item .t{font-weight:800;font-size:14.5px;letter-spacing:-.015em;color:var(--text);margin:0}
.dd-item .d{font-size:12.5px;color:var(--dim);margin:2px 0 0;line-height:1.45}
.dd-item .ico{width:34px;height:34px;border-radius:10px}
.dd-item .ico svg{width:17px;height:17px}

.burger{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);place-items:center;background:var(--glass)}
.burger span{display:block;width:17px;height:1.6px;background:var(--text);border-radius:2px;transition:transform .35s var(--ease),opacity .25s}
.burger span+span{margin-top:4.5px}
.burger.on span:nth-child(1){transform:translateY(6.1px) rotate(45deg)}
.burger.on span:nth-child(2){opacity:0}
.burger.on span:nth-child(3){transform:translateY(-6.1px) rotate(-45deg)}

.mobile{
  position:fixed;inset:72px 0 0;z-index:99;background:var(--mobile-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:24px var(--gut) 48px;overflow-y:auto;display:none;flex-direction:column;gap:6px;
}
.mobile.on{display:flex;animation:fadeUp .35s var(--ease)}
.mobile a{padding:14px 4px;font-size:19px;font-weight:800;letter-spacing:-.025em;border-bottom:1px solid var(--border)}
.mobile .grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:20px;padding-bottom:4px}
.mobile .btn{margin-top:24px;width:100%}
@media(max-width:960px){
  .nav-links,.nav-cta .btn{display:none}
  .burger{display:grid}
}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding-top:150px;padding-bottom:clamp(60px,8vw,110px);overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(32px,5vw,64px);align-items:center}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr;gap:44px}}
.hero-solo{grid-template-columns:1fr;justify-items:center;text-align:center}
.hero-solo .hero-cta{justify-content:center}
.hero-copy{display:flex;flex-direction:column;gap:26px;position:relative;z-index:2}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
/* ============================================================
   MARQUEE / STAT STRIP
   ============================================================ */
.strip{border-block:1px solid var(--border);background:var(--soft)}
.strip-in{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
@media(max-width:760px){.strip-in{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg);padding:30px clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:5px}
.stat b{font-size:clamp(28px,3.6vw,40px);font-weight:900;letter-spacing:-.045em;line-height:1}
.stat span{font-family:var(--f-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}

/* ============================================================
   PROCESS
   ============================================================ */
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
@media(max-width:900px){.proc{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.proc{grid-template-columns:1fr}}
.step{padding:26px;display:flex;flex-direction:column;gap:12px;border-radius:var(--r-md)}
.step .n{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--lime-ink)}
.step h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.step p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}
.step .dur{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:auto;padding-top:14px}

/* ============================================================
   SERVICE CARDS
   ============================================================ */
.svc{
  padding:30px;border-radius:var(--r-lg);display:flex;flex-direction:column;gap:16px;
  min-height:270px;transition:border-color .45s var(--ease),transform .45s var(--ease),background .45s var(--ease);
}
.svc:hover{border-color:rgba(163,230,53,.34);transform:translateY(-5px);background:var(--glass-hi)}
.svc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tag{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted);
  padding:5px 10px;border:1px solid var(--border);border-radius:100px;background:var(--soft);
}
.svc .go{display:flex;align-items:center;gap:7px;color:var(--lime-ink);font-weight:800;font-size:14.5px;opacity:.85;transition:opacity .3s,gap .3s var(--ease)}
.svc:hover .go{opacity:1;gap:11px}

/* ============================================================
   WHY / FEATURE LIST
   ============================================================ */
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,56px);align-items:start}
@media(max-width:900px){
  .why-grid{grid-template-columns:1fr}
  .why-grid .head-block{position:static !important;top:auto !important}
}
.why-list{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.why-item{
  display:flex;gap:18px;padding:22px 6px;border-bottom:1px solid var(--border);
  transition:padding-left .4s var(--ease),background .4s var(--ease);
}
.why-item:hover{padding-left:16px;background:linear-gradient(90deg,rgba(163,230,53,.05),transparent)}
.why-item .k{font-family:var(--f-mono);font-size:11px;color:var(--lime-ink);padding-top:5px;flex:none;letter-spacing:.1em}
.why-item h4{margin:0 0 4px;font-size:17.5px;font-weight:800;letter-spacing:-.02em}
.why-item p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}

/* ============================================================
   PROJECTS
   ============================================================ */
.proj{
  border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;
  width:100%;box-sizing:border-box;min-width:0;
  transition:transform .5s var(--ease),border-color .5s var(--ease);
}

/* ============================================================
   THEME
   Light is the default per brand direction. Session-only:
   to persist across visits, save THEME to localStorage here
   and read it back on load.
   ============================================================ */
let THEME = 'light';
function applyTheme(){
  document.documentElement.setAttribute('data-theme', THEME);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', THEME === 'light' ? '#F4F6F1' : '#0A0A0A');
  document.querySelectorAll('.tsw').forEach(b=>{
    b.setAttribute('aria-checked', THEME === 'light');
    b.setAttribute('aria-label', THEME === 'light' ? 'Switch to dark mode' : 'Switch to light mode');
  });
}
function toggleTheme(btn){
  THEME = THEME === 'dark' ? 'light' : 'dark';
  applyTheme();
  if(btn && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    btn.classList.remove('zap');
    void btn.offsetWidth;
    btn.classList.add('zap');
  }
}

/* ============================================================
   ROUTER + BEHAVIOUR
   ============================================================ */
const app = document.getElementById('app');

function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  const [path, anchor] = h.split('#');
  const parts = path.split('/').filter(Boolean);
  return {parts, anchor};
}

let CURRENT = null;
function render(){
  const {parts, anchor} = parseHash();
  const key = parts.join('/');
  if(CURRENT === key && document.getElementById('main')){
    if(anchor){
      const t = document.getElementById(anchor);
      if(t){ t.scrollIntoView({behavior:'smooth',block:'start'}); return; }
    }
    window.scrollTo({top:0,behavior:'smooth'}); return;
  }
  CURRENT = key;
  let view, title;
  if(parts[0]==='services' && SVCMAP[parts[1]]){
    const s = SVCMAP[parts[1]];
    view = servicePage(s);
    title = `${s.title} — Kaarjo Technology`;
    document.querySelector('meta[name="description"]').setAttribute('content', s.heroP.slice(0,155));
  } else if(parts[0]==='work' && PROJMAP[parts[1]]){
    const p = PROJMAP[parts[1]];
    view = projectPage(p);
    title = `${p.n} — Kaarjo Technology`;
    document.querySelector('meta[name="description"]').setAttribute('content', p.d.slice(0,155));
  } else {
    view = home();
    title = 'Kaarjo Technology — Engineering Intelligent Software for Real Business Problems';
  }
  document.title = title;
  app.innerHTML = nav() + view + footer();
  wire();
  if(anchor){
    const el = document.getElementById(anchor);
    if(el){ requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth',block:'start'})); return; }
  }
  window.scrollTo(0,0);
}

function wire(){
  /* theme switch */
  document.querySelectorAll('.tsw').forEach(b=>b.addEventListener('click',()=>toggleTheme(b)));
  applyTheme();

  /* sticky nav */
  const navEl = document.getElementById('nav');
  const onScroll = ()=> navEl.classList.toggle('stuck', window.scrollY > 12);
  onScroll();
  window.removeEventListener('scroll', window.__ks || (()=>{}));
  window.__ks = onScroll;
  window.addEventListener('scroll', onScroll, {passive:true});

  /* mobile menu */
  const burger = document.getElementById('burger'), mob = document.getElementById('mobile');
  burger.addEventListener('click', ()=>{
    const on = mob.classList.toggle('on');
    burger.classList.toggle('on', on);
    burger.setAttribute('aria-expanded', on);
    document.body.style.overflow = on ? 'hidden' : '';
  });
  mob.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
    mob.classList.remove('on'); burger.classList.remove('on');
    burger.setAttribute('aria-expanded','false'); document.body.style.overflow='';
  }));

  /* services dropdown — keyboard accessible */
  const dd = document.querySelector('.dd');
  if(dd){
    const btn = dd.querySelector('.navitem');
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const on = dd.classList.toggle('open');
      btn.setAttribute('aria-expanded', on);
    });
    document.addEventListener('click', ()=>{ dd.classList.remove('open'); btn.setAttribute('aria-expanded','false'); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') dd.classList.remove('open'); });
  }

  /* FAQ accordion */
  document.querySelectorAll('.faq-item').forEach(item=>{
    const q = item.querySelector('.faq-q'), a = item.querySelector('.faq-a');
    q.addEventListener('click', ()=>{
      const open = item.classList.contains('open');
      item.closest('.faq').querySelectorAll('.faq-item').forEach(o=>{
        o.classList.remove('open'); o.querySelector('.faq-a').style.maxHeight = null;
        o.querySelector('.faq-q').setAttribute('aria-expanded','false');
      });
      if(!open){
        item.classList.add('open');
        a.style.maxHeight = a.scrollHeight + 'px';
        q.setAttribute('aria-expanded','true');
      }
    });
  });

  /* scroll reveal */
  const els = document.querySelectorAll('.reveal');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    els.forEach(e=>e.classList.add('in'));
  } else {
    const io = new IntersectionObserver((entries)=>{
      entries.forEach((en,i)=>{
        if(en.isIntersecting){
          const sibs = [...en.target.parentElement.children].indexOf(en.target);
          en.target.style.transitionDelay = Math.min(sibs,5)*70 + 'ms';
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    },{rootMargin:'0px 0px -8% 0px',threshold:.08});
    els.forEach(e=>io.observe(e));
  }

  /* contact form */
  const form = document.getElementById('contactForm');
  if(form){
    const sent = document.getElementById('sentState');
    const errBox = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');
    const submitLabel = submitBtn.innerHTML;
    const fail = f => { f.closest('.field').classList.add('err'); };
    form.querySelectorAll('input,select,textarea').forEach(el=>{
      el.addEventListener('input', ()=>el.closest('.field').classList.remove('err'));
      el.addEventListener('change', ()=>el.closest('.field').classList.remove('err'));
    });
    form.addEventListener('submit', e=>{
      e.preventDefault();
      errBox.style.display = 'none';
      let ok = true, first = null;
      const v = id => form.querySelector(id);
      const checks = [
        [v('#f-name'), el => el.value.trim().length > 1],
        [v('#f-email'), el => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value.trim())],
        [v('#f-service'), el => el.value !== ''],
        [v('#f-msg'), el => el.value.trim().length > 0]
      ];
      checks.forEach(([el,test])=>{
        if(!test(el)){ fail(el); ok = false; first = first || el; }
      });
      if(!ok){ first.focus(); return; }

      if(!window.emailjs || EMAILJS.publicKey === 'YOUR_PUBLIC_KEY'){
        console.warn('[kaarjo] EmailJS is not configured yet — fill in EMAILJS.publicKey / serviceId / templateId.');
        errBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Sending…';
      emailjs.sendForm(EMAILJS.serviceId, EMAILJS.templateId, form)
        .then(()=>{
          form.style.display = 'none';
          sent.classList.add('on');
        })
        .catch(err=>{
          console.error('[kaarjo] EmailJS send failed', err);
          errBox.style.display = 'block';
        })
        .finally(()=>{
          submitBtn.disabled = false;
          submitBtn.innerHTML = submitLabel;
        });
    });
    const reset = document.getElementById('resetForm');
    reset && reset.addEventListener('click', ()=>{
      form.reset(); form.style.display = ''; document.getElementById('sentState').classList.remove('on');
    });
  }
}

window.addEventListener('hashchange', render);
if(!location.hash) location.replace('#/');
render();

</script>
